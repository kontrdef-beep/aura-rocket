<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gorilla Case - Aura Rocket 3D</title>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: #151a23;
            --border: rgba(255, 255, 255, 0.08);
            --accent-blue: #2f80ed;
            --star-gold: #ffb703;
            --green: #27ae60;
            --red: #eb5757;
            --text-muted: #828a99;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER & TOP NAV */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(11, 14, 20, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .back-btn { font-size: 16px; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .app-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .app-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 11px; }

        /* 3D VIEWPORT CONTAINER */
        .viewport-container { position: relative; height: 260px; background: radial-gradient(circle at 50% 30%, #121929 0%, #080a0f 100%); overflow: hidden; }
        #canvas3d { width: 100%; height: 100%; display: block; }

        /* COEFFICIENTS HISTORY BAR */
        .history-row { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: var(--bg); scrollbar-width: none; }
        .history-row::-webkit-scrollbar { display: none; }
        .coeff-badge { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; background: var(--card-bg); border: 1px solid var(--border); color: #fff; white-space: nowrap; }
        .coeff-badge.active { background: #fff; color: #000; }
        .coeff-badge.blue { background: rgba(47, 128, 237, 0.2); color: var(--accent-blue); border-color: var(--accent-blue); }

        /* BETS & PRIZES LIST */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .bets-panel { flex: 1; background: var(--card-bg); margin: 0 12px 12px 12px; border-radius: 20px; border: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        .bets-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 0 4px; }
        
        .bets-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; scrollbar-width: none; }
        .bet-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        .user-col { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 32px; height: 32px; border-radius: 50%; background: #232a36; display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; }
        .user-details { display: flex; flex-direction: column; }
        .user-name { font-size: 13px; color: #fff; }
        .user-bet { font-size: 11px; color: var(--star-gold); display: flex; align-items: center; gap: 4px; }
        .user-coeff { color: var(--green); margin-left: 6px; font-weight: 800; }
        
        .prize-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }

        /* FOOTER ACTION BUTTON */
        .action-footer { padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); }
        .btn-bet { background: var(--accent-blue); border: none; color: #fff; font-size: 17px; font-weight: 800; padding: 16px; border-radius: 18px; width: 100%; cursor: pointer; box-shadow: 0 6px 20px rgba(47, 128, 237, 0.4); }
        .btn-bet.cashout { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4); }

        /* MODAL DEPOSIT (ПОПОЛНЕНИЕ В СТИЛЕ GORILLA CASE) */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); display: none; flex-direction: column; z-index: 100; }
        .modal.active { display: flex; }
        .modal-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .tabs-bar { display: flex; background: #1a202c; padding: 4px; border-radius: 16px; margin: 0 16px 16px 16px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tab-btn.active { background: var(--accent-blue); color: #fff; }

        .modal-body { flex: 1; overflow-y: auto; padding: 0 16px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
        .deposit-card { background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid var(--border); }
        .deposit-amount { font-size: 48px; font-weight: 900; color: #fff; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .quick-amounts { display: flex; gap: 10px; justify-content: center; }
        .q-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 13px; }

        .gifts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .gift-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
        .gift-icon { font-size: 32px; }
        .gift-price { background: rgba(255,183,3,0.1); color: var(--star-gold); padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="back-btn" onclick="toggleDepositModal()">← Назад</div>
        <div class="app-title"><div class="app-avatar">🦍</div> Gorilla Case</div>
        <div style="font-size: 18px; cursor: pointer;" onclick="toggleDepositModal()">💳</div>
    </header>

    <!-- COEFFICIENTS HISTORY -->
    <div class="history-row">
        <div class="coeff-badge active">x2.62</div>
        <div class="coeff-badge">x1.19</div>
        <div class="coeff-badge blue">x2.36</div>
        <div class="coeff-badge blue">x2.03</div>
        <div class="coeff-badge">x1.05</div>
        <div class="coeff-badge blue">x4.12</div>
    </div>

    <!-- 3D ROCKET VIEWPORT -->
    <div class="viewport-container">
        <canvas id="canvas3d"></canvas>
    </div>

    <!-- LIVE BETS & GIFTS PANEL -->
    <div class="main-content">
        <div class="bets-panel">
            <div class="bets-header">
                <span>Ставка</span>
                <span>Возможн. приз</span>
            </div>
            <div class="bets-list" id="betsList">
                <!-- Dynamic Bets Injection -->
            </div>
        </div>
    </div>

    <!-- FOOTER ACTION BUTTON -->
    <div class="action-footer">
        <button class="btn-bet" id="actionBtn" onclick="handleGameStep()">Сделать ставку</button>
    </div>

    <!-- MODAL DEPOSIT (ПОПОЛНЕНИЕ) -->
    <div class="modal" id="depositModal">
        <div class="modal-header">
            <div class="back-btn" onclick="toggleDepositModal()">← Назад</div>
            <div class="app-title">Пополнение баланса</div>
            <div></div>
        </div>

        <div class="tabs-bar">
            <button class="tab-btn" onclick="switchTab('gram')">💎 GRAM</button>
            <button class="tab-btn active" onclick="switchTab('stars')">⭐ Звездами</button>
            <button class="tab-btn" onclick="switchTab('gifts')">🎁 Подарками</button>
        </div>

        <div class="modal-body" id="modalBody">
            <!-- Dynamic Tab Content -->
        </div>
    </div>

<script>
    // --- TELEGRAM NFT GIFTS DATABASE ---
    const GIFTS_DATABASE = [
        { name: "Факел", price: 476, icon: "🔥" },
        { name: "Кролик", price: 479, icon: "🐰" },
        { name: "Леденец", price: 520, icon: "🍭" },
        { name: "Рюкзак", price: 530, icon: "🎒" },
        { name: "Ракета", price: 630, icon: "🚀" },
        { name: "Печенье", price: 682, icon: "🍪" },
        { name: "Обезьяна", price: 842, icon: "🎨" },
        { name: "Сердечко", price: 2412, icon: "❤️" },
        { name: "Кольцо", price: 3329, icon: "💍" },
        { name: "Машина", price: 5825, icon: "🚗" },
        { name: "Часы", price: 5827, icon: "⌚" },
        { name: "Кристалл", price: 7604, icon: "💎" },
        { name: "Сумка", price: 13337, icon: "👜" },
        { name: "Кот", price: 27697, icon: "🐱" }
    ];

    // Helper: Find closest Telegram gift for potential win
    function getGiftForValue(stars) {
        let sorted = [...GIFTS_DATABASE].sort((a,b) => b.price - a.price);
        let found = sorted.find(g => stars >= g.price);
        return found || { name: "Звёзды", price: stars, icon: "⭐" };
    }

    // --- THREE.JS 3D ENGINE (GORILLA TON ROCKET) ---
    const container = document.querySelector('.viewport-container');
    const canvas = document.getElementById('canvas3d');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // LIGHTS
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0x2f80ed, 2.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // 3D MOON / TON COIN BACKGROUND
    const moonGeo = new THREE.SphereGeometry(1.5, 32, 32);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xffe082, emissive: 0xffb703, emissiveIntensity: 0.3, roughness: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.set(-2.5, 1.8, -3);
    scene.add(moonMesh);

    // 3D BLUE TON ROCKET WITH GORILLA
    const rocketGroup = new THREE.Group();

    // Fuselage (Blue Capsule)
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.6, 2.2, 32);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, metalness: 0.6, roughness: 0.2 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    rocketGroup.add(bodyMesh);

    // Nose Cone
    const noseGeo = new THREE.ConeGeometry(0.5, 0.8, 32);
    const noseMat = new THREE.MeshStandardMaterial({ color: 0x0044cc, metalness: 0.8 });
    const noseMesh = new THREE.Mesh(noseGeo, noseMat);
    noseMesh.position.y = 1.5;
    rocketGroup.add(noseMesh);

    // Glass Cockpit
    const glassGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1 });
    const glassMesh = new THREE.Mesh(glassGeo, glassMat);
    glassMesh.position.set(0, 0.5, 0.3);
    rocketGroup.add(glassMesh);

    // Gorilla Head inside cockpit
    const gorillaGeo = new THREE.SphereGeometry(0.25, 16, 16);
    const gorillaMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
    const gorillaMesh = new THREE.Mesh(gorillaGeo, gorillaMat);
    gorillaMesh.position.set(0, 0.45, 0.2);
    rocketGroup.add(gorillaMesh);

    // Thruster Flame
    const flameGeo = new THREE.ConeGeometry(0.3, 1, 16);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    const flameMesh = new THREE.Mesh(flameGeo, flameMat);
    flameMesh.position.y = -1.5;
    flameMesh.rotation.x = Math.PI;
    rocketGroup.add(flameMesh);

    rocketGroup.rotation.z = -Math.PI / 3;
    scene.add(rocketGroup);

    // STARFIELD PARTICLES
    const starsGeo = new THREE.BufferGeometry();
    const count = 300;
    const pos = new Float32Array(count * 3);
    for(let i=0; i<count*3; i+=3) {
        pos[i] = (Math.random() - 0.5) * 20;
        pos[i+1] = (Math.random() - 0.5) * 20;
        pos[i+2] = (Math.random() - 0.5) * 20;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.06, color: 0xffffff }));
    scene.add(starField);

    // GAME STATE LOGIC
    let isFlying = false;
    let multiplier = 1.00;
    let betAmount = 530;

    // INITIAL LIVE BETS DATA
    const betsData = [
        { name: "ihzu_7r31", bet: 2442, coeff: 2.22, won: true },
        { name: "h3v5hjsjn", bet: 330, coeff: 1.65, won: true },
        { name: "vad1mf999", bet: 530, coeff: 2.65, won: false },
        { name: "yourn3xtgam3", bet: 530, coeff: 2.65, won: false },
        { name: "saharoc88", bet: 476, coeff: 1.50, won: false }
    ];

    function renderBetsList() {
        const listEl = document.getElementById('betsList');
        listEl.innerHTML = '';
        betsData.forEach(item => {
            let totalWin = Math.floor(item.bet * (isFlying ? multiplier : item.coeff));
            let gift = getGiftForValue(totalWin);

            let row = document.createElement('div');
            row.className = 'bet-item';
            row.innerHTML = `
                <div class="user-col">
                    <div class="avatar-circle">👤</div>
                    <div class="user-details">
                        <span class="user-name">${item.name}</span>
                        <span class="user-bet">⭐ ${item.bet} <span class="user-coeff">x${(isFlying ? multiplier : item.coeff).toFixed(2)} ${item.won ? '✓' : ''}</span></span>
                    </div>
                </div>
                <div class="prize-badge">
                    <span>${gift.icon}</span>
                    <span style="color:#fff; font-weight:800;">${gift.name}</span>
                </div>
            `;
            listEl.appendChild(row);
        });
    }

    function handleGameStep() {
        const btn = document.getElementById('actionBtn');
        if(!isFlying) {
            isFlying = true;
            multiplier = 1.00;
            btn.innerText = "Забрать выигрыш";
            btn.className = "btn-bet cashout";
        } else {
            isFlying = false;
            btn.innerText = "Сделать ставку";
            btn.className = "btn-bet";
            alert(`🎉 Поздравляем! Вы выиграли: ${getGiftForValue(betAmount * multiplier).icon} ${getGiftForValue(betAmount * multiplier).name}`);
            multiplier = 1.00;
            renderBetsList();
        }
    }

    // ANIMATION LOOP
    function animate() {
        requestAnimationFrame(animate);

        moonMesh.rotation.y += 0.005;

        if(isFlying) {
            multiplier += 0.008;
            rocketGroup.position.x = Math.sin(Date.now() * 0.004) * 0.3;
            rocketGroup.position.y = Math.cos(Date.now() * 0.004) * 0.2;
            flameMesh.scale.set(1 + Math.random()*0.4, 1 + Math.random()*0.6, 1);
            renderBetsList();
        } else {
            rocketGroup.position.y = Math.sin(Date.now() * 0.002) * 0.1;
        }

        renderer.render(scene, camera);
    }
    animate();
    renderBetsList();

    // MODAL & DEPOSIT TABS LOGIC
    function toggleDepositModal() {
        const modal = document.getElementById('depositModal');
        modal.classList.toggle('active');
        if(modal.classList.contains('active')) switchTab('stars');
    }

    function switchTab(tab) {
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(b => b.classList.remove('active'));
        
        const body = document.getElementById('modalBody');
        if(tab === 'stars') {
            buttons[1].classList.add('active');
            body.innerHTML = `
                <div class="deposit-card">
                    <div style="font-size:12px; color:var(--text-muted); font-weight:700;">Пополнить Звёздами</div>
                    <div class="deposit-amount">200 ⭐</div>
                    <div class="quick-amounts">
                        <button class="q-btn">+ 500</button>
                        <button class="q-btn">+ 2 000</button>
                        <button class="q-btn">+ 5 000</button>
                    </div>
                </div>
                <button class="btn-bet">Оплатить через Telegram</button>
            `;
        } else if(tab === 'gifts') {
            buttons[2].classList.add('active');
            let gridHTML = `<div style="font-weight:800; font-size:14px; margin-bottom:6px;">Доступные подарки для взноса:</div><div class="gifts-grid">`;
            GIFTS_DATABASE.forEach(g => {
                gridHTML += `
                    <div class="gift-card">
                        <div class="gift-icon">${g.icon}</div>
                        <div class="gift-price">⭐ ${g.price}</div>
                    </div>
                `;
            });
            gridHTML += `</div>`;
            body.innerHTML = gridHTML;
        } else {
            buttons[0].classList.add('active');
            body.innerHTML = `
                <div class="deposit-card">
                    <div style="font-size:12px; color:var(--text-muted); font-weight:700;">Web3 Оплата TON / GRAM</div>
                    <div class="deposit-amount">10 GRAM</div>
                </div>
                <button class="btn-bet">Подключить кошелёк</button>
            `;
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
