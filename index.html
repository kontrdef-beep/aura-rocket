<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Rocket Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --accent-red: #ff1744;
            --text-main: #ffffff;
            --text-sub: #8f9bba;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            z-index: 10;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .logo-title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        .coin-icon {
            color: #ffd700;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.5));
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* History Ribbon */
        .history-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--card-border);
        }

        .history-bar::-webkit-scrollbar { display: none; }

        .history-item {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
        }

        .history-item.green { color: var(--accent-green); border-color: rgba(0, 230, 118, 0.3); }
        .history-item.orange { color: var(--accent-orange); border-color: rgba(255, 145, 0, 0.3); }

        /* Main Game Viewport */
        .game-viewport {
            position: relative;
            flex: 1;
            margin: 10px 16px;
            background: radial-gradient(circle at center, #151c2a 0%, #0b0e14 100%);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .multiplier-overlay {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .multiplier-val {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            color: var(--accent-cyan);
        }

        .multiplier-status {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
            margin-top: -4px;
        }

        .multiplier-val.crashed {
            color: var(--accent-red);
            text-shadow: 0 0 25px rgba(255, 23, 68, 0.6);
        }

        /* Betting Panel */
        .bottom-panel {
            padding: 0 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bets-list {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            height: 110px;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .control-box {
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 4px 8px;
        }

        .bet-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .btn-quick {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-left: 4px;
        }

        .action-btn {
            flex: 1.2;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .action-btn.bet {
            background: linear-gradient(135deg, #00c853, #00e676);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
        }

        .action-btn.cashout {
            background: linear-gradient(135deg, #ff6d00, #ff9100);
            box-shadow: 0 0 20px rgba(255, 145, 0, 0.4);
        }

        .action-btn.disabled {
            background: #2a3447;
            color: #5d6b82;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Modal Popups */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #121824;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 20px; font-weight: 800; }
        .close-btn { background: none; border: none; color: var(--text-sub); font-size: 24px; cursor: pointer; }

        .modal-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #000;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }

        .admin-input, .admin-select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .admin-select option { background: #121824; color: #fff; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-group">
            <div class="logo-icon">🚀</div>
            <div class="logo-title">Aura Rocket</div>
        </div>
        <div class="header-controls">
            <div class="balance-badge">
                <span class="coin-icon">🪙</span>
                <span id="userBalance">1,000</span>
            </div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <!-- History Bar -->
    <div class="history-bar" id="historyBar">
        <div class="history-item green">2.45x</div>
        <div class="history-item orange">1.12x</div>
        <div class="history-item green">5.80x</div>
        <div class="history-item green">3.20x</div>
    </div>

    <!-- Canvas Graphic area -->
    <div class="game-viewport">
        <canvas id="gameCanvas"></canvas>
        <div class="multiplier-overlay">
            <div class="multiplier-val" id="multVal">1.00x</div>
            <div class="multiplier-status" id="multStatus">ОЖИДАНИЕ</div>
        </div>
    </div>

    <!-- Controls & Live Bets -->
    <div class="bottom-panel">
        <div class="bets-list" id="betsList"></div>

        <div class="control-box">
            <div class="input-group">
                <input type="number" id="betAmount" class="bet-input" value="100" min="10">
                <button class="btn-quick" onclick="adjustBet(0.5)">½</button>
                <button class="btn-quick" onclick="adjustBet(2)">2x</button>
            </div>
            <button id="mainBtn" class="action-btn bet" onclick="handleMainAction()">СТАВКА</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Настройки</div>
                <button class="close-btn" onclick="closeModal('settingsModal')">✕</button>
            </div>
            
            <p style="color: var(--text-sub); font-size: 14px;">Пополнение баланса (Telegram Stars):</p>
            <button class="modal-btn" onclick="buyStars(50, 500)">⭐ 50 Stars (+500 монет)</button>
            <button class="modal-btn" onclick="buyStars(100, 1200)">⭐ 100 Stars (+1200 монет)</button>
            <button class="modal-btn" onclick="buyStars(500, 7000)">⭐ 500 Stars (+7000 монет)</button>
            
            <hr style="border-color: var(--card-border);">
            <button class="modal-btn" style="background: rgba(255,255,255,0.1); color: #fff;" onclick="openAdminModal()">🔒 Панель администратора</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Админ-панель</div>
                <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
            </div>

            <!-- Password Entry -->
            <div id="adminLockScreen" style="display: flex; flex-direction: column; gap: 12px;">
                <p style="color: var(--text-sub); font-size: 13px;">Введите пароль администратора для доступа к кнопкам управления:</p>
                <input type="password" id="adminPassInput" class="admin-input" placeholder="Пароль доступа">
                <button class="modal-btn" onclick="verifyAdminPassword()">Войти</button>
            </div>

            <!-- Admin Controls -->
            <div id="adminControls" style="display: none; flex-direction: column; gap: 12px;">
                <p style="color: var(--accent-green); font-size: 13px; font-weight: 700;">✓ Доступ разрешен</p>
                
                <label style="font-size: 12px; color: var(--text-sub);">Скорость взлёта ракеты:</label>
                <select id="gameSpeedSelect" class="admin-select" onchange="changeGameSpeed()">
                    <option value="0.5">0.5x (Очень медленно и плавно)</option>
                    <option value="1.0" selected>1.0x (Стандартная комфортная)</option>
                    <option value="1.5">1.5x (Динамичная)</option>
                    <option value="2.0">2.0x (Быстрая)</option>
                </select>

                <label style="font-size: 12px; color: var(--text-sub); margin-top: 6px;">Принудительный Икс следующего раунда:</label>
                <input type="number" id="forcedMultInput" class="admin-input" placeholder="Например: 10.5">
                <button class="modal-btn" style="background: var(--accent-orange); color: #000;" onclick="setForcedMultiplier()">Зафиксировать Икс</button>
                <button class="modal-btn" style="background: var(--accent-red); color: #fff;" onclick="forceCrashNow()">Сделать Краш Сейчас</button>
            </div>
        </div>
    </div>

<script>
    // TELEGRAM WEB APP INIT
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const BOT_TOKEN = "8808997336:AAEGHKHCgvhGXSaSqlnngx3wKBkrWt9dzMw";

    // GAME STATE
    let balance = 1000;
    let currentBet = 0;
    let isBetPlaced = false;
    let isCashedOut = false;
    let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED
    let multiplier = 1.00;
    let targetMultiplier = 2.00;
    let forcedTarget = null;
    let gameSpeedFactor = 1.0; // Speed modifier
    let isAdminAuthenticated = false;

    // CANVAS GRAPHICS
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ROCKET VECTOR GRAPHIC
    function drawSleekRocket(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Rocket Flame
        if (gameState === 'RUNNING') {
            const flameLen = Math.random() * 20 + 25;
            const grad = ctx.createLinearGradient(-flameLen, 0, 0, 0);
            grad.addColorStop(0, 'rgba(255, 23, 68, 0)');
            grad.addColorStop(0.5, '#ff9100');
            grad.addColorStop(1, '#ffd700');

            ctx.beginPath();
            ctx.moveTo(-15, -6);
            ctx.lineTo(-15 - flameLen, 0);
            ctx.lineTo(-15, 6);
            ctx.fillStyle = grad;
            ctx.fill();

            // Particles
            for(let i=0; i<2; i++) {
                particles.push({
                    x: x - Math.cos(angle)*20,
                    y: y - Math.sin(angle)*20,
                    vx: (Math.random()-0.5)*2 - Math.cos(angle)*3,
                    vy: (Math.random()-0.5)*2 - Math.sin(angle)*3,
                    size: Math.random()*4 + 2,
                    alpha: 1
                });
            }
        }

        // Rocket Body
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(25, 0);
        ctx.lineTo(-10, -10);
        ctx.lineTo(-15, -6);
        ctx.lineTo(-15, 6);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fill();

        // Neon Wings
        ctx.fillStyle = '#00f2fe';
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(-15, -14);
        ctx.lineTo(-8, -4);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(-15, 14);
        ctx.lineTo(-8, 4);
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = '#0b0e14';
        ctx.beginPath();
        ctx.arc(5, -1, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    // GAME RENDER LOOP WITH REAL TIME DELTA (DELTATIME)
    let lastTime = performance.now();

    function render(now) {
        let dt = (now - lastTime) / 1000;
        if (isNaN(dt) || dt > 0.1) dt = 0.016;
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Background Grid Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for (let i = 0; i < canvas.height; i += 40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Draw Trail Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
            if (p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }

        let startX = 40;
        let startY = canvas.height - 40;
        let endX = canvas.width - 60;
        let endY = 60;

        if (gameState === 'RUNNING') {
            // SMOOTH & FAIR MULTIPLIER GROWTH FORMULA
            let growthRate = (0.08 + (multiplier * 0.12)) * gameSpeedFactor;
            multiplier += growthRate * dt;

            document.getElementById('multVal').innerText = multiplier.toFixed(2) + 'x';

            // Visual Progress tied smoothly to Multiplier
            let progress = Math.min(Math.log(multiplier) / Math.log(12), 1);
            let currentX = startX + (endX - startX) * progress;
            let currentY = startY - (startY - endY) * Math.pow(progress, 0.7);

            // Curve Line
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currentX-startX)*0.5, startY, currentX, currentY);
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Rocket Flight Angle
            let angle = -Math.atan2(startY - currentY, currentX - startX);
            drawSleekRocket(currentX, currentY, angle);

            if (multiplier >= targetMultiplier) {
                triggerCrash();
            }
        } else {
            drawSleekRocket(startX, startY, -Math.PI/6);
        }

        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // GAME ENGINE
    function startNewRound() {
        gameState = 'RUNNING';
        multiplier = 1.00;
        isCashedOut = false;

        targetMultiplier = forcedTarget ? forcedTarget : (Math.random() < 0.35 ? 1.15 + Math.random()*0.6 : 1.8 + Math.random()*4.5);
        forcedTarget = null;

        document.getElementById('multStatus').innerText = 'ВЗЛЁТ...';
        document.getElementById('multVal').classList.remove('crashed');

        updateMainButton();
    }

    function triggerCrash() {
        gameState = 'CRASHED';
        document.getElementById('multStatus').innerText = 'КРАШ!';
        document.getElementById('multVal').classList.add('crashed');

        isBetPlaced = false;
        updateMainButton();

        setTimeout(() => {
            document.getElementById('multStatus').innerText = 'ОЖИДАНИЕ';
            document.getElementById('multVal').innerText = '1.00x';
            gameState = 'IDLE';
            updateMainButton();
        }, 3000);
    }

    function handleMainAction() {
        if (gameState === 'IDLE') {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if (bet > balance || bet <= 0) return alert('Недостаточно монет!');
            
            balance -= bet;
            currentBet = bet;
            isBetPlaced = true;
            updateUI();
            
            startNewRound();
        } else if (gameState === 'RUNNING' && isBetPlaced && !isCashedOut) {
            isCashedOut = true;
            let winAmount = Math.floor(currentBet * multiplier);
            balance += winAmount;
            updateUI();
            alert(`Вы забрали ${winAmount} монет (${multiplier.toFixed(2)}x)!`);
            updateMainButton();
        }
    }

    function updateMainButton() {
        const btn = document.getElementById('mainBtn');
        if (gameState === 'IDLE') {
            btn.innerText = 'СТАВКА';
            btn.className = 'action-btn bet';
        } else if (gameState === 'RUNNING') {
            if (isBetPlaced && !isCashedOut) {
                btn.innerText = 'ЗАБРАТЬ';
                btn.className = 'action-btn cashout';
            } else {
                btn.innerText = 'В ИГРЕ...';
                btn.className = 'action-btn disabled';
            }
        } else {
            btn.innerText = 'ЖДЁМ...';
            btn.className = 'action-btn disabled';
        }
    }

    function adjustBet(factor) {
        let input = document.getElementById('betAmount');
        input.value = Math.max(10, Math.floor(input.value * factor));
    }

    function updateUI() {
        document.getElementById('userBalance').innerText = balance.toLocaleString();
    }

    // TELEGRAM STARS REAL PAYMENT (XTR)
    async function buyStars(starsAmount, coinsAmount) {
        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: `Пополнение ${coinsAmount} монет`,
                    description: `Игровая валюта Aura Rocket`,
                    payload: `topup_${coinsAmount}`,
                    provider_token: "",
                    currency: "XTR",
                    prices: [{ label: `${coinsAmount} монет`, amount: starsAmount }]
                })
            });

            const data = await response.json();
            if (data.ok && data.result) {
                tg.openInvoice(data.result, (status) => {
                    if (status === 'paid') {
                        balance += coinsAmount;
                        updateUI();
                        alert(`Успешно! Начислено ${coinsAmount} монет.`);
                        closeModal('settingsModal');
                    } else {
                        alert('Оплата отменена.');
                    }
                });
            } else {
                alert('Ошибка счета Stars. Проверьте токен.');
            }
        } catch (e) {
            alert('Ошибка сети при вызове Telegram Stars.');
        }
    }

    // ADMIN SECURITY & ACCESS
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function openAdminModal() { 
        closeModal('settingsModal'); 
        document.getElementById('adminModal').style.display = 'flex'; 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function verifyAdminPassword() {
        const pass = document.getElementById('adminPassInput').value;
        if (pass === 'AuraAdmin2026!') {
            isAdminAuthenticated = true;
            document.getElementById('adminLockScreen').style.display = 'none';
            document.getElementById('adminControls').style.display = 'flex';
        } else {
            alert('Неверный пароль администратора!');
        }
    }

    function changeGameSpeed() {
        if (!isAdminAuthenticated) return;
        gameSpeedFactor = parseFloat(document.getElementById('gameSpeedSelect').value);
    }

    function setForcedMultiplier() {
        if (!isAdminAuthenticated) return alert('Доступ запрещен!');
        let mult = parseFloat(document.getElementById('forcedMultInput').value);
        if (mult && mult > 1.0) {
            forcedTarget = mult;
            alert(`Икс следующего раунда равен: ${mult}x`);
            closeModal('adminModal');
        }
    }

    function forceCrashNow() {
        if (!isAdminAuthenticated) return alert('Доступ запрещен!');
        if (gameState === 'RUNNING') {
            triggerCrash();
            closeModal('adminModal');
        } else {
            alert('Игра сейчас не запущена!');
        }
    }
</script>
</body>
