<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Rocket - Pro Visual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card: rgba(21, 26, 38, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #2f80ed;
            --accent-glow: rgba(47, 128, 237, 0.4);
            --star: #ffb703;
            --green: #27ae60;
            --red: #eb5757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Bar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(11, 14, 22, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .logo { font-weight: 900; font-size: 15px; letter-spacing: 1.5px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        .balance-badge { background: linear-gradient(135deg, rgba(255,183,3,0.15) 0%, rgba(255,183,3,0.05) 100%); border: 1px solid rgba(255, 183, 3, 0.3); padding: 6px 14px; border-radius: 20px; font-weight: 800; color: var(--star); display: flex; gap: 6px; align-items: center; box-shadow: 0 0 15px rgba(255,183,3,0.1); }

        /* Canvas Viewport */
        .viewport { position: relative; height: 260px; margin: 12px 16px; background: radial-gradient(circle at 50% 30%, #121824 0%, #07090e 100%); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: block; }
        
        .mult-box { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 100%; }
        .mult-val { font-size: 52px; font-weight: 900; letter-spacing: -1px; text-shadow: 0 0 30px var(--accent-glow); transition: color 0.2s; }
        .mult-val.crashed { color: var(--red); text-shadow: 0 0 30px rgba(235, 87, 87, 0.6); }

        /* Dynamic Gift Card Badge */
        .nft-badge { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(15, 20, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--green); color: #fff; padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(39, 174, 96, 0.25); opacity: 0; transition: opacity 0.3s; }
        .nft-badge.visible { opacity: 1; }
        .nft-badge img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        /* Controls Area */
        .controls { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 6px 10px; align-items: center; gap: 8px; backdrop-filter: blur(10px); }
        .bet-input { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 800; width: 100%; outline: none; }
        .quick-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .quick-btn:active { background: rgba(255,255,255,0.15); }

        .btn-main { background: linear-gradient(135deg, #2f80ed 0%, #0056c6 100%); border: none; color: #fff; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; box-shadow: 0 6px 20px var(--accent-glow); transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.98); }
        .btn-main.cashout { background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%); color: #000; box-shadow: 0 6px 25px rgba(242, 153, 74, 0.4); }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(11, 14, 22, 0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
        .nav-tab { color: #5d6778; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-tab.active { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo">AURA <span>ROCKET</span></div>
        <div class="balance-badge">⭐ 1,500</div>
    </header>

    <div class="viewport">
        <canvas id="gameCanvas"></canvas>
        <div class="mult-box">
            <div class="mult-val" id="multVal">1.00x</div>
        </div>
        <div class="nft-badge" id="nftBadge">
            <img src="https://cache.tg.market/gifts/torch.png" alt="Gift">
            <span>Выигрыш: <strong style="color:var(--star)">🔥 Факел (476 ⭐)</strong></span>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" class="bet-input" value="100" readonly>
            <button class="quick-btn">50</button>
            <button class="quick-btn">500</button>
            <button class="quick-btn">2K</button>
        </div>
        <button id="actionBtn" class="btn-main" onclick="toggleTestRun()">Запустить Тест Графики</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-tab active">🚀 Игра</div>
        <div class="nav-tab">🎒 Инвентарь</div>
        <div class="nav-tab">💎 Пополнение</div>
        <div class="nav-tab">⚙️ Настройки</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // VECTOR ROCKET SVG DATA
    const rocketSVG = new Image();
    rocketSVG.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="%232F80ED" d="M32 2C18 14 14 34 14 50l12-4 6 12 6-12 12 4C50 34 46 14 32 2z"/><path fill="%230056C6" d="M32 2c-4 8-6 20-6 32l6-4 6 4C38 22 36 10 32 2z"/><circle cx="32" cy="22" r="6" fill="%23FFF"/><circle cx="32" cy="22" r="4" fill="%2307090E"/><path fill="%23FF5722" d="M26 52l6 10 6-10z"/></svg>';

    // GAME STATE & ANIMATION ENGINE
    let isRunning = false;
    let progress = 0;
    let multiplier = 1.00;
    let particles = [];

    function drawGrid(w, h) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        const step = 30;
        for (let x = 0; x < w; x += step) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
    }

    function addExhaustParticle(x, y, angle) {
        for (let i = 0; i < 3; i++) {
            particles.push({
                x: x,
                y: y,
                vx: -Math.cos(angle) * (2 + Math.random() * 3) + (Math.random() - 0.5),
                vy: -Math.sin(angle) * (2 + Math.random() * 3) + (Math.random() - 0.5),
                size: Math.random() * 5 + 3,
                alpha: 1,
                color: Math.random() > 0.4 ? '#ff5722' : '#ffb703'
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;
            p.size *= 0.95;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    }

    function renderFrame() {
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;

        ctx.clearRect(0, 0, w, h);
        drawGrid(w, h);

        if (isRunning) {
            progress += 0.005;
            multiplier += 0.015;
            document.getElementById('multVal').innerText = multiplier.toFixed(2) + 'x';

            if (multiplier >= 2.0) {
                document.getElementById('nftBadge').classList.add('visible');
            }

            // Calculate Curve Points
            const startX = 30;
            const startY = h - 30;
            const currentX = startX + (w - 80) * Math.min(progress, 1);
            const currentY = startY - (h - 80) * Math.min(Math.pow(progress, 0.8), 1);

            // Calculate Rocket Angle
            const prevX = startX + (w - 80) * Math.min(progress - 0.01, 1);
            const prevY = startY - (h - 80) * Math.min(Math.pow(progress - 0.01, 0.8), 1);
            const angle = Math.atan2(currentY - prevY, currentX - prevX);

            // Draw Area Gradient Under Curve
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currentX - startX) * 0.5, startY, currentX, currentY);
            ctx.lineTo(currentX, startY);
            ctx.closePath();
            let bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, 'rgba(47, 128, 237, 0.25)');
            bgGrad.addColorStop(1, 'rgba(47, 128, 237, 0.0)');
            ctx.fillStyle = bgGrad;
            ctx.fill();

            // Draw Curved Flight Line
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currentX - startX) * 0.5, startY, currentX, currentY);
            ctx.strokeStyle = '#2f80ed';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#2f80ed';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset shadow

            // Particles Exhaust
            addExhaustParticle(currentX, currentY, angle);
            updateParticles();

            // Draw Rocket
            ctx.save();
            ctx.translate(currentX, currentY);
            ctx.rotate(angle + Math.PI / 4); // Adjust vector alignment
            ctx.drawImage(rocketSVG, -20, -20, 40, 40);
            ctx.restore();

            if (progress >= 1) triggerCrash();
        }

        requestAnimationFrame(renderFrame);
    }

    function toggleTestRun() {
        if (isRunning) return;
        isRunning = true;
        progress = 0;
        multiplier = 1.00;
        particles = [];
        document.getElementById('multVal').className = 'mult-val';
        document.getElementById('nftBadge').classList.remove('visible');
        document.getElementById('actionBtn').innerText = 'ПОЛЁТ...';
        document.getElementById('actionBtn').className = 'btn-main cashout';
    }

    function triggerCrash() {
        isRunning = false;
        document.getElementById('multVal').className = 'mult-val crashed';
        document.getElementById('multVal').innerText = 'УЛЕТЕЛ!';
        document.getElementById('actionBtn').innerText = 'Запустить Тест Графики';
        document.getElementById('actionBtn').className = 'btn-main';
    }

    requestAnimationFrame(renderFrame);
</script>
</body>
</html>
